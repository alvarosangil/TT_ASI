# Configuración del Servidor
spring.application.name=backend-principal
server.port=8080

# Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/congresos_db
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración JWT
jwt.secret=VFVDbEF2RVNlY3JldGFNdXlMYXJnYVlTZWd1cmFQYXJhRmlybWFyVG9rZW5zSldUMjAyNQ==
jwt.expiration=86400000

# Configuración CORS
cors.allowed-origins=http://localhost:5173

# Configuración del Microservicio Verificador
ms.verificador.url=http://localhost:8082

# Logging
logging.level.com.congresos=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
